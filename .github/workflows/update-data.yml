name: Update public data snapshots

on:
  schedule:
    - cron: '17 0,4,12 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/update-data.yml'
      - '.github/workflows/deploy-pages.yml'
      - 'scripts/**'
      - 'package.json'
      - 'package-lock.json'

permissions:
  contents: write

concurrency:
  group: public-data-snapshots
  cancel-in-progress: false

jobs:
  update:
    if: github.ref == 'refs/heads/main' && (github.actor != 'github-actions[bot]' || github.event_name != 'push')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Fetch and validate sources without waiting for model generation
        run: npm run update:data
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          NEWS_MAX_ARTICLES_PER_RUN: '2'
          NEWS_PROCESSING_STAGE: source

      - name: Report news publication and optional deep generation separately
        run: node scripts/news/run-report.mjs

      - name: Validate published snapshot contracts
        run: npm run validate:data

      - name: Commit changed snapshots
        run: node scripts/site/publish-data.mjs
