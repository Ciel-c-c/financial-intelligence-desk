name: Deploy public site to GitHub Pages

on:
  push:
    branches:
      - main
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Restore last successful situation snapshot
        run: |
          mkdir -p work
          curl --fail --silent --show-error --max-time 20 \
            https://ciel-c-c.github.io/financial-intelligence-desk/data/global-situation.json \
            --output work/last-situation-snapshot.json \
            || cp public/data/global-situation.json work/last-situation-snapshot.json

      - name: Refresh official global situation feeds
        run: npm run fetch:situation -- --previous work/last-situation-snapshot.json

      - name: Test
        run: npm test -- --run

      - name: Typecheck
        run: npm run typecheck

      - name: Build site
        run: npm run build

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload site artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

      - name: Deploy public site
        id: deployment
        uses: actions/deploy-pages@v4
