name: Update market session snapshots

# Paused for the news + knowledge MVP. Legacy producer remains available locally.
on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: public-data-snapshots
  cancel-in-progress: false

jobs:
  update:
    if: ${{ false }} # Intentionally paused, including manual dispatch
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Retrieve and validate market sessions without model calls
        run: npm run update:market
      - run: npm run validate:data
      - name: Publish without overwriting concurrent data or code changes
        run: node scripts/site/publish-data.mjs
